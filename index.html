    <meta property="og:title" content="AI Cyber Studio" />

    <script>
      // Standalone Static Execution: Silence any WebSocket / Vite dev server connection noise
      (function() {
        if (typeof window !== 'undefined') {
          window.addEventListener('unhandledrejection', function (e) {
            var reason = e && (e.reason || e.message || '');
            var str = typeof reason === 'object' ? (reason.message || JSON.stringify(reason)) : String(reason);
            if (str.indexOf('WebSocket') !== -1 || str.indexOf('vite') !== -1 || str.indexOf('failed to connect') !== -1) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return false;
            }
          });
          window.addEventListener('error', function (e) {
            var msg = (e && e.message) || '';
            if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return false;
            }
          });
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
